<!DOCTYPE html>
<html>
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#1d4ed8">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon-192.png">
  <link rel="apple-touch-icon" href="icon-192.png">
  <script src="https://accounts.google.com/gsi/client" async defer></script>
  <style>
    :root{--blue:#1d4ed8;--amber:#f5a623;--ink:#172033;--mut:#667085;--line:#e0e6ef;--bg:#f3f6fb}
    *{box-sizing:border-box}
    body{font-family:Arial,sans-serif;background:var(--bg);margin:0;color:var(--ink);padding-bottom:84px}
    header{background:#fff;padding:12px 16px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:12px}
    header b{font-size:18px;display:block;line-height:1.2}
    header small{color:var(--mut);font-size:13px}
    main{max-width:760px;margin:0 auto;padding:16px}
    section{animation:fade .15s ease}
    @keyframes fade{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
    .hidden{display:none!important}
    .card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:18px;margin-bottom:16px}
    h2{margin:0 0 12px;font-size:20px}
    .muted{color:var(--mut)}
    .stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:16px}
    .stat{background:#fff;border:1px solid var(--line);border-radius:12px;padding:12px}
    .stat b{display:block;font-size:20px;color:var(--blue)}
    .stat span{font-size:12px;color:var(--mut)}
    button,.btn{background:var(--blue);color:#fff;border:0;border-radius:10px;padding:0 18px;min-height:46px;font-size:16px;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;text-decoration:none}
    button.secondary,.btn.secondary{background:#fff;color:var(--ink);border:1px solid #ccd4e0}
    button.danger{background:#d92d20}
    .small{min-height:40px;padding:0 14px;font-size:14px}
    button:disabled{opacity:.6;cursor:not-allowed}
    .row{display:flex;gap:10px;flex-wrap:wrap}
    label{display:block;font-weight:bold;margin:14px 0 6px}
    input{width:100%;padding:12px;min-height:46px;border:1px solid #ccd4e0;border-radius:8px;font-size:16px;background:#fff}
    .grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
    .status{margin-top:12px;white-space:pre-wrap}
    .bill{display:grid;grid-template-columns:1fr auto;gap:6px 12px;padding:14px 0;border-bottom:1px solid var(--line)}
    .bill:last-child{border-bottom:0}
    .bill .amt{font-weight:bold;text-align:right}
    .bill .sub{color:var(--mut);font-size:14px}
    .bill .acts{grid-column:1/-1;display:flex;gap:10px}
    nav{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid var(--line);display:flex;padding:6px 8px calc(6px + env(safe-area-inset-bottom,0px));gap:6px}
    nav button{flex:1;background:transparent;color:var(--mut);flex-direction:column;font-size:13px;min-height:52px;padding:4px}
    nav button.on{color:var(--blue);font-weight:bold;background:#eef3ff}
    nav svg{width:22px;height:22px;margin-bottom:2px}
    @media(max-width:600px){.grid{grid-template-columns:1fr}.stat b{font-size:17px}}
    header{padding-top:calc(12px + env(safe-area-inset-top,0px))}
    #login{position:fixed;inset:0;background:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:24px;text-align:center;z-index:10}
    #login h2{margin:0}
  </style>
</head>
<body>
<div id="login">
  <svg width="72" height="72" viewBox="0 0 40 40" aria-hidden="true"><rect width="40" height="40" rx="10" fill="#1d4ed8"/><polygon points="23,6 11,23 19,23 16,34 29,16 21,16" fill="#f5a623"/></svg>
  <h2>Rajesh Electricals<br>Bill Manager</h2>
  <p class="muted">Sign in with your approved Google account.</p>
  <div id="gbtn"></div>
  <p id="loginMsg" class="muted"></p>
</div>
<header>
  <svg width="40" height="40" viewBox="0 0 40 40" aria-hidden="true">
    <rect width="40" height="40" rx="10" fill="#1d4ed8"/>
    <polygon points="23,6 11,23 19,23 16,34 29,16 21,16" fill="#f5a623"/>
  </svg>
  <div><b>Rajesh Electricals</b><small>Bill Manager</small></div>
</header>

<main>
  <section id="home">
    <div class="stats">
      <div class="stat"><b id="stCount">-</b><span>Total bills</span></div>
      <div class="stat"><b id="stMonth">-</b><span>Bills this month</span></div>
      <div class="stat"><b id="stAmt">-</b><span>This month's amount</span></div>
    </div>
    <div class="row" style="margin-bottom:16px">
      <button onclick="showPage('add')">+ Add New Bill</button>
      <button class="secondary" onclick="showPage('search')">Search Bills</button>
    </div>
    <div class="card">
      <h2>Recent bills</h2>
      <div id="recent" class="muted">Loading...</div>
    </div>
  </section>

  <section id="add" class="card hidden">
    <h2>Add New Bill</h2>
    <form id="billForm">
      <label>Vendor name *</label>
      <input name="vendor" list="vendors" required placeholder="e.g. ABC Electricals">
      <datalist id="vendors"></datalist>
      <div class="grid">
        <div><label>Bill number</label><input name="billNumber" placeholder="Invoice number"></div>
        <div><label>Bill date *</label><input name="billDate" type="date" required></div>
      </div>
      <label>Bill amount (₹)</label>
      <input name="amount" type="number" min="0" step="0.01" inputmode="decimal" placeholder="0.00">
      <label>Upload bill PDF or photo *</label>
      <input name="file" type="file" accept=".pdf,.png,.jpg,.jpeg,.webp" required>
      <p class="muted">Use a clear PDF or photo. Keep uploads under 8 MB.</p>
      <button id="saveBtn" type="submit">Save Bill</button>
      <div id="addStatus" class="status"></div>
    </form>
  </section>

  <section id="search" class="card hidden">
    <h2>Search Bills</h2>
    <label>Vendor</label>
    <input id="sVendor" list="vendors" placeholder="All vendors">
    <label>Bill number</label>
    <input id="sNumber" placeholder="Enter bill number">
    <div class="grid">
      <div><label>From date</label><input id="sFrom" type="date"></div>
      <div><label>To date</label><input id="sTo" type="date"></div>
    </div>
    <div class="row" style="margin-top:18px">
      <button onclick="searchBills()">Search</button>
      <button class="secondary" onclick="clearSearch()">Clear</button>
    </div>
    <div id="searchStatus" class="status"></div>
    <div id="results"></div>
  </section>
</main>

<nav>
  <button id="nav-home" onclick="showPage('home')">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 11l9-8 9 8v10H3z"/></svg>Home</button>
  <button id="nav-add" onclick="showPage('add')">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 5v14M5 12h14"/></svg>Add</button>
  <button id="nav-search" onclick="showPage('search')">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/></svg>Search</button>
</nav>

<script>
  // ====== EDIT THESE TWO LINES ======
  const API_URL='https://script.google.com/macros/s/AKfycbyVdwtIKMsrGDvfF4bli7TGw7kKPa1AatArznfkhybfQm8NprD9YMWTfwGUCZSXL3w/exec';
  const CLIENT_ID='383377902484-8bl3nd5t91ipept85ngllmakud5jp2sd.apps.googleusercontent.com';
  // ===================================
  let idToken=localStorage.getItem('rb_token')||'';

  function tokenOk(){
    try{const p=JSON.parse(atob(idToken.split('.')[1].replace(/-/g,'+').replace(/_/g,'/')));
      return p.exp*1000>Date.now()+60000;}catch(e){return false;}
  }
  async function api(action,payload){
    const res=await fetch(API_URL,{method:'POST',headers:{'Content-Type':'text/plain'},
      body:JSON.stringify({idToken,action,payload})});
    const out=await res.json();
    if(out.ok) return out.data;
    if(out.error==='AUTH'){signOut('Please sign in again.');throw new Error('Please sign in again.');}
    if(out.error==='NOT_ALLOWED'){signOut('This Google account is not approved for this app.');throw new Error('Not approved.');}
    throw new Error(out.error||'Something went wrong.');
  }
  // Lets the app code call the server in the same style as before
  function gsr(){
    let ok=()=>{},fail=showError;
    const chain=new Proxy({},{get(_,name){
      if(name==='withSuccessHandler') return f=>{ok=f;return chain;};
      if(name==='withFailureHandler') return f=>{fail=f;return chain;};
      return (...args)=>{api(name,args[0]).then(ok).catch(fail);};
    }});
    return chain;
  }
  function signOut(msg){
    idToken='';localStorage.removeItem('rb_token');
    document.getElementById('login').classList.remove('hidden');
    document.getElementById('loginMsg').textContent=msg||'';
  }
  function onCred(r){
    idToken=r.credential;localStorage.setItem('rb_token',idToken);
    document.getElementById('login').classList.add('hidden');
    document.getElementById('loginMsg').textContent='';
    startApp();
  }
  function startApp(){showPage('home');loadVendors();}
  function initAuth(){
    if('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js');
    if(tokenOk()){document.getElementById('login').classList.add('hidden');startApp();}
    const wait=setInterval(()=>{
      if(window.google&&google.accounts){
        clearInterval(wait);
        google.accounts.id.initialize({client_id:CLIENT_ID,callback:onCred,auto_select:true});
        google.accounts.id.renderButton(document.getElementById('gbtn'),{theme:'filled_blue',size:'large',text:'signin_with'});
      }
    },200);
  }

  const PAGES=['home','add','search'];
  function showPage(page){
    PAGES.forEach(p=>{
      document.getElementById(p).classList.toggle('hidden',p!==page);
      document.getElementById('nav-'+p).classList.toggle('on',p===page);
    });
    if(page==='search') searchBills();
    if(page==='home') loadHome();
    window.scrollTo(0,0);
  }

  function inr(v){
    if(v===''||v==null) return '—';
    const n=Number(v);
    return isFinite(n)?'₹'+n.toLocaleString('en-IN',{maximumFractionDigits:2}):'—';
  }

  function billRow(r,withDelete){
    return '<div class="bill"><div><b>'+escapeHtml(r.vendor)+'</b>'+
      '<div class="sub">'+escapeHtml((r.number?'No. '+r.number:'No number')+' · '+r.date)+'</div></div>'+
      '<div class="amt">'+inr(r.amount)+'</div>'+
      '<div class="acts"><a class="btn secondary small" href="'+escapeHtml(r.url)+'" target="_blank" rel="noopener">Open bill</a>'+
      (withDelete?'<button class="danger small" data-id="'+escapeHtml(r.id)+'" data-label="'+
        escapeHtml(r.vendor+' / '+(r.number||'no number')+' / '+r.date)+'">Delete</button>':'')+
      '</div></div>';
  }

  function loadHome(){
    gsr().withSuccessHandler(s=>{
      document.getElementById('stCount').textContent=s.count;
      document.getElementById('stMonth').textContent=s.monthCount;
      document.getElementById('stAmt').textContent=inr(s.monthTotal);
      const box=document.getElementById('recent');
      box.className='';
      box.innerHTML=s.recent.length?s.recent.map(r=>billRow(r,false)).join(''):
        '<p class="muted">No bills yet. Tap "Add New Bill" to save your first one.</p>';
    }).withFailureHandler(showError).getHomeSummary();
  }

  function loadVendors(){
    gsr().withSuccessHandler(list=>{
      document.getElementById('vendors').innerHTML=list.map(v=>
        '<option value="'+escapeHtml(v)+'"></option>').join('');
    }).withFailureHandler(showError).getVendors();
  }

  document.getElementById('billForm').addEventListener('submit',async e=>{
    e.preventDefault();
    const form=e.target;
    const btn=document.getElementById('saveBtn');
    const status=document.getElementById('addStatus');
    if(btn.disabled) return;

    const file=form.file.files[0];
    if(!file){alert('Please select a bill document.');return;}
    if(file.size>8*1024*1024){alert('Please use a file smaller than 8 MB.');return;}

    const done=()=>{btn.disabled=false;btn.textContent='Save Bill';};
    btn.disabled=true; btn.textContent='Saving...';
    status.textContent='Saving bill... please wait and do not close this page.';

    try{
      const base64=await new Promise((resolve,reject)=>{
        const reader=new FileReader();
        reader.onload=()=>resolve(reader.result.split(',')[1]);
        reader.onerror=reject;
        reader.readAsDataURL(file);
      });
      const data={
        vendor:form.vendor.value.trim(),
        billNumber:form.billNumber.value.trim(),
        billDate:form.billDate.value,
        amount:form.amount.value,
        fileName:file.name,
        mimeType:file.type || 'application/octet-stream',
        fileData:base64
      };
      gsr().withSuccessHandler(msg=>{
        status.textContent='✓ '+msg;
        form.reset();loadVendors();done();
      }).withFailureHandler(err=>{
        status.textContent='Could not save: '+err.message;
        done();
      }).saveBill(data);
    }catch(err){
      status.textContent='Could not read file: '+err.message;
      done();
    }
  });

  function searchBills(notice){
    const status=document.getElementById('searchStatus');
    status.textContent='Searching...';
    document.getElementById('results').innerHTML='';
    gsr().withSuccessHandler(rows=>{
      const summary=rows.length?rows.length+' bill(s) found.':'No bills found.';
      status.textContent=(typeof notice==='string'&&notice?notice+'\n':'')+summary;
      document.getElementById('results').innerHTML=rows.map(r=>billRow(r,true)).join('');
    }).withFailureHandler(err=>status.textContent='Search failed: '+err.message)
      .searchBills({
        vendor:document.getElementById('sVendor').value.trim(),
        number:document.getElementById('sNumber').value.trim(),
        from:document.getElementById('sFrom').value,
        to:document.getElementById('sTo').value
      });
  }

  function clearSearch(){
    ['sVendor','sNumber','sFrom','sTo'].forEach(id=>document.getElementById(id).value='');
    searchBills();
  }

  document.getElementById('results').addEventListener('click',e=>{
    const btn=e.target.closest('button[data-id]');
    if(!btn||btn.disabled) return;
    const ok=confirm('Delete this bill?\n\n'+btn.dataset.label+
      '\n\nIt will disappear from the app. The original file is moved to the "Deleted Bills" folder in Drive, not erased.');
    if(!ok) return;
    btn.disabled=true; btn.textContent='Deleting...';
    gsr().withSuccessHandler(msg=>{
      loadVendors(); searchBills(msg);
    }).withFailureHandler(err=>{
      btn.disabled=false; btn.textContent='Delete';
      document.getElementById('searchStatus').textContent='Could not delete: '+err.message;
    }).deleteBill(btn.dataset.id);
  });

  function escapeHtml(value){
    return String(value??'').replace(/[&<>"']/g,c=>({
      '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
    }[c]));
  }

  function showError(err){alert(err.message||String(err));}
  initAuth();
</script>
</body>
</html>
